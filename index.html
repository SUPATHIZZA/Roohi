<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For You 💙</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#fdf8f3,#f3eef9,#eef3fa,#fdf8f3);background-size:300% 300%;animation:bg 14s ease infinite;min-height:100vh;color:#2d2a4a;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.screen{display:none;min-height:100vh;padding:24px;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;position:relative;z-index:2}
.screen.on{display:flex;animation:fade .8s}
@keyframes fade{from{opacity:0;filter:blur(10px);transform:scale(1.05)}to{opacity:1;filter:none;transform:none}}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
#bgo{position:fixed;inset:0;background:linear-gradient(#ffffff77,#ffffff33);z-index:0;display:none}
h1{font-size:2rem;background:linear-gradient(90deg,#3b3a8f,#6d7cf5,#3b3a8f);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200%}}
button{background:#6d7cf5;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 14px #6d7cf588}
.card{background:#ffffffee;color:#0b2a5b;border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 30px #0002}
.card img{max-width:100%;border-radius:12px;margin-bottom:10px}
.big{font-size:3rem;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
#cover{width:220px;height:220px;object-fit:cover;border-radius:50%;border:6px solid #fff;box-shadow:0 10px 30px #6d7cf5aa;display:none;animation:pulse 3s infinite}
#s0{overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#3b2a9a55,transparent 70%)}
#mbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;overflow:hidden}
#mbg::after{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff55,#ffffff88)}
.mb{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;filter:blur(2px);transition:opacity 2.6s ease;animation:drift 26s ease-in-out infinite alternate}
.mb.on{opacity:1}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
#uni{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity 1.6s;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#3b2a9a 0%,#1a1463 45%,#07071f 100%)}
#uni.on{opacity:1}
#uni .neb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.45;animation:nebd 22s ease-in-out infinite alternate}
@keyframes nebd{to{transform:translate(8%,5%) scale(1.25)}}
#ground{position:absolute;left:-10%;right:-10%;bottom:-8%;height:20%;background:radial-gradient(ellipse at 50% 0%,#17144a,#04041a 70%);border-radius:50% 50% 0 0/100% 100% 0 0}
#ustar{position:absolute;left:17%;top:4%;width:100px;transform:translateX(-50%);overflow:visible;animation:sfloat 5s ease-in-out infinite alternate}
@keyframes sfloat{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(8px)}}
#ustar .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.6s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.28);opacity:.55}}
#ustar .rays{transform-box:fill-box;transform-origin:center;animation:spin 46s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ustar .rays2{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite reverse;opacity:.6}
#ustar .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#ustar .sp{transform-box:fill-box;transform-origin:center;animation:spk 2.2s ease-in-out infinite}
@keyframes spk{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
#ground{z-index:0}
#ugrass{position:absolute;left:0;bottom:0;width:100%;height:12%}
#ugrass .gs{transform-box:fill-box;transform-origin:50% 100%;animation:gsw 5s ease-in-out infinite alternate}
#ugrass .g2{animation-duration:7s;animation-delay:-2.5s}
@keyframes gsw{from{transform:skewX(-2.5deg)}to{transform:skewX(2.5deg)}}
#uflower{position:absolute;left:17%;bottom:1.5%;width:96px;overflow:visible;transform:translateX(-50%);transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-50%) rotate(-3.5deg)}to{transform:translateX(-50%) rotate(3.5deg)}}
#uflower .aura{transform-box:fill-box;transform-origin:center;animation:halo 3.4s ease-in-out infinite}
#uflower .pt{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.1);opacity:0}
#uni.on #uflower .pt{animation:bloom 3.4s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:var(--d)}
@keyframes bloom{to{transform:scale(1);opacity:1}}
#uflower .blos{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.05)}}
#uflower .stm{opacity:0}
#uni.on #uflower .stm{animation:fin 2.2s 3.8s forwards}
@keyframes fin{to{opacity:1}}
#umotes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ubeam{position:absolute;left:17%;top:12%;bottom:8%;width:140px;transform:translateX(-50%);background:linear-gradient(#fff7c266,#f0abfc18 60%,transparent);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);animation:beam 3s ease-in-out infinite}
@keyframes beam{50%{opacity:.35}}
#ubox{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0}
#uwrap{position:absolute;inset:0}
#uimg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:block;opacity:.55}
.tp{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px #c4b5fd;pointer-events:none}
body.dark #cap{color:#fff;text-shadow:0 2px 10px #000b}
#s1.uniMode{justify-content:flex-end;padding-bottom:13vh}
#ustar{transition:top 2.6s cubic-bezier(.45,.05,.25,1),opacity 1.2s}
#ubeam{transition:top 2.6s cubic-bezier(.45,.05,.25,1),bottom .5s}
#ustar.charge{filter:drop-shadow(0 0 34px #fff7c2) brightness(1.35)}
#uflower{transition:filter 1s}
#uflower.call{filter:drop-shadow(0 0 20px #f0abfc)}
#uflower.merged{filter:drop-shadow(0 0 44px #fde68a) brightness(1.25)}
#uemo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:4.5rem;filter:drop-shadow(0 0 14px #c4b5fd);animation:pulse 2s infinite}
#shint{font-size:.95rem;color:#e9d5ff;text-shadow:0 0 10px #a78bfa;opacity:0;transition:opacity .8s;animation:pls 1.8s ease-in-out infinite}
#s1.uniMode{touch-action:none}
#night,#art1,#art2{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#night{background:radial-gradient(ellipse at 50% 55%,#3b2a9a,#0a0a2e 75%)}
#art1,#art2{object-fit:contain;transition:opacity .9s}
#art1{background:#fff}
#art2{filter:invert(1);mix-blend-mode:screen;opacity:0}
#infw{position:relative;z-index:3;width:100%;max-width:420px;aspect-ratio:400/210}
#cvi,#inf{position:absolute;inset:0;width:100%;height:100%}
#inf{touch-action:none}#cvi{pointer-events:none}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{opacity:.15}}
#stage{position:relative;width:300px;height:450px;cursor:pointer;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px #0008;background:#ffffff12}
#stage.paper{background:#fff}
#simg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:invert(1);mix-blend-mode:screen}
#stage.paper #simg{filter:none;mix-blend-mode:normal}
#semo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem}
.draw{animation:draw 3.2s ease-out both}
.kb{animation:draw 3.2s ease-out both,kb 18s ease-in-out both}
.kb2{animation:draw 3.2s ease-out both,kb2 18s ease-in-out both}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,-2%)}}
@keyframes kb2{from{transform:scale(1.14) translate(2%,0)}to{transform:scale(1)}}
#cap{max-width:420px;min-height:3.6em;font-size:1.1rem;line-height:1.6;color:#2d2a4a;text-shadow:0 1px 6px #fff,0 0 14px #fff}
#snext{transition:opacity .6s}
#cap{transition:opacity .6s;cursor:pointer}
.pulse{animation:pls 1.8s ease-in-out infinite}
@keyframes pls{50%{opacity:.4}}
.tl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;width:100%;padding:8px}
.tl .card{flex:0 0 85%;scroll-snap-align:center}
.date{font-size:.85rem;color:#1d4ed8}
#heartArea{position:relative;width:100%;max-width:420px;height:50vh;background:#ffffffaa;border-radius:20px;overflow:hidden}
.h{position:absolute;top:-40px;font-size:2rem;cursor:pointer;animation:fall linear forwards;user-select:none}
@keyframes fall{to{top:105%}}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;width:100%}
.c{aspect-ratio:1;background:#6d7cf5;border-radius:12px;font-size:2rem;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.c.up{background:#fff;color:#000}.c.done{background:#bbf7d0}
.opt{display:block;width:100%;margin-top:8px;background:#fff;color:#0b2a5b;border:2px solid #6d7cf5;box-shadow:none}
.wrong{animation:sh .4s;background:#fecaca!important}.right{background:#bbf7d0!important}
#gift{font-size:6rem;cursor:pointer;display:inline-block}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px) rotate(-8deg)}75%{transform:translateX(10px) rotate(8deg)}}
.conf{position:fixed;top:-30px;font-size:1.6rem;animation:fall 4s linear forwards;pointer-events:none;z-index:50}
.bgf{position:fixed;bottom:-40px;opacity:.5;pointer-events:none;z-index:1;animation:up linear forwards}
@keyframes up{to{bottom:110%;transform:rotate(40deg)}}
.sw{position:relative;width:300px;height:160px;margin:auto;border-radius:14px;overflow:hidden;background:#fff;color:#0b2a5b}
.sw div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;font-weight:600}
#cv{position:absolute;inset:0;touch-action:none}
.fab{position:fixed;bottom:12px;background:#ffffffcc;color:#2d2a4a;box-shadow:0 2px 10px #0002;backdrop-filter:blur(6px);padding:8px 12px;z-index:9;box-shadow:none}
#vault{position:fixed;inset:0;background:#fff;color:#0b2a5b;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#vault a{color:#2563eb;font-size:1.1rem}
input,textarea{padding:10px;border-radius:10px;border:1px solid #ccc;font-size:1rem;font-family:inherit;width:100%}
#vault{overflow-y:auto}#vault>:first-child{margin-top:auto}#vault>:last-child{margin-bottom:auto}
#vMsg{width:100%;max-width:420px;display:none;flex-direction:column;gap:8px;text-align:left}#vMsgSt{min-height:1.4em;font-size:.95rem;text-align:center}

/* ===== cinematic universe ===== */
body.dark{background:#07071f;animation:none}
#shint{display:none}
.neb{animation:nebd 22s ease-in-out infinite alternate,nebh 46s linear infinite alternate!important}
@keyframes nebh{to{filter:blur(50px) hue-rotate(55deg)}}
#umw{position:absolute;left:-30%;top:10%;width:160%;height:28%;transform:rotate(-24deg);background:radial-gradient(ellipse at 50% 50%,#d8ccff55,#7c3aed2a 42%,transparent 70%);filter:blur(16px);animation:mwd 70s ease-in-out infinite alternate}
@keyframes mwd{to{transform:rotate(-20deg) translate(4%,3%)}}
.aur{position:absolute;left:-30%;right:-30%;top:2%;height:34%;filter:blur(34px);mix-blend-mode:screen;opacity:.3;border-radius:50%;
  background:radial-gradient(ellipse at 30% 50%,#34d39966,transparent 55%),radial-gradient(ellipse at 70% 45%,#a78bfa77,transparent 55%);animation:aur 19s ease-in-out infinite alternate}
.aur.a2{top:14%;height:26%;opacity:.25;animation-duration:27s;animation-delay:-9s;background:radial-gradient(ellipse at 25% 50%,#f0abfc66,transparent 55%),radial-gradient(ellipse at 75% 50%,#60a5fa66,transparent 55%)}
@keyframes aur{0%{transform:translateX(-7%) scaleY(.8) rotate(-2deg);opacity:.15}100%{transform:translateX(7%) scaleY(1.25) rotate(2deg);opacity:.5}}
#ubk{position:absolute;inset:0;pointer-events:none}
.bk{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffffff55,#c4b5fd1f 55%,transparent 70%);filter:blur(2px);animation:bkf var(--t) ease-in-out infinite alternate}
.bk:nth-child(3n){background:radial-gradient(circle,#fde68a55,#f0abfc1a 55%,transparent 70%)}
@keyframes bkf{from{transform:translate(0,0) scale(.8);opacity:.15}to{transform:translate(var(--x),var(--y)) scale(1.2);opacity:.65}}
#uflare{position:absolute;left:0;top:0;width:560px;height:3px;margin:-1.5px 0 0 -280px;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(90deg,transparent,#fff7c299 38%,#fff 50%,#fff7c299 62%,transparent);filter:blur(1px);animation:flr 3.4s ease-in-out infinite alternate}
@keyframes flr{from{scale:.55 1;opacity:.45}to{scale:1.1 1;opacity:.95}}
#uring{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px;border-radius:50%;border:2px solid #fff7c2;box-shadow:0 0 30px #fde68a,inset 0 0 20px #fde68a88;opacity:0;pointer-events:none}
#uring.go{animation:ring 1.5s ease-out}
@keyframes ring{from{scale:.3;opacity:.95}to{scale:11;opacity:0}}
#uflower.call{animation:sway 4.5s ease-in-out infinite alternate,callp 1.9s ease-in-out infinite}
@keyframes callp{0%,100%{filter:drop-shadow(0 0 10px #f0abfc)}50%{filter:drop-shadow(0 0 38px #fde68a) brightness(1.25)}}
/* photo moment */
#uveil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 2.4s ease;background:rgba(6,5,35,.3);-webkit-backdrop-filter:blur(18px) brightness(.5);backdrop-filter:blur(18px) brightness(.5)}
#uveil.on{opacity:1}
#uwrap{animation:pkb 26s ease-out both}
@keyframes pkb{from{transform:scale(1)}to{transform:scale(1.07)}}
#upbg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(20px);opacity:0}
#uedge{position:absolute;left:0;right:0;height:3px;margin-top:-1px;opacity:0;background:linear-gradient(90deg,transparent,#fff 30%,#e9d5ff 50%,#fff 70%,transparent);box-shadow:0 0 18px 6px #c4b5fd99}
#uemo{font-size:7rem}
#ubox.out{animation:pout 3.4s cubic-bezier(.4,0,.6,1) forwards}
@keyframes pout{0%{opacity:1;filter:blur(0);transform:scale(1)}35%{opacity:.9;filter:blur(5px)}100%{opacity:0;filter:blur(30px);transform:scale(1.12)}}
#uscrim{position:fixed;left:0;right:0;bottom:0;height:44vh;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.8s;background:linear-gradient(transparent,#04031cc7)}
body.photo #uscrim{opacity:1}
#uflash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 45%,#ffffffcc,#c4b5fd66 40%,transparent 70%)}
#uflash.go{animation:fl2 1.8s ease-out}
@keyframes fl2{0%{opacity:0}18%{opacity:.7}100%{opacity:0}}
#lbT,#lbB{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;pointer-events:none;transition:height 1.8s cubic-bezier(.6,0,.2,1)}
#lbT{top:0}#lbB{bottom:0}
body.photo #lbT,body.photo #lbB{height:6vh}
#ucine{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;visibility:hidden;background:radial-gradient(ellipse at 50% 50%,transparent 52%,#03021fa6 100%)}
body.dark #ucine{visibility:visible}
#ugrain{position:absolute;inset:-50%;opacity:.05;animation:grain .8s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-5%,4%)}40%{transform:translate(4%,-6%)}60%{transform:translate(-3%,-3%)}80%{transform:translate(6%,5%)}100%{transform:translate(0,0)}}
#s1.uniMode,#s1.uniMode *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.dark #cap{pointer-events:none;font-size:1.25rem;line-height:1.7;max-width:440px}
/* intro: cover photo spreads over the whole site and melts into the universe */
#intro{position:fixed;inset:0;z-index:5;pointer-events:none;display:none;background:radial-gradient(ellipse at 50% 55%,#3b2a9a,#0a0a2e 75%)}
#intro.go{display:block;animation:iov 6.6s ease-in-out forwards}
@keyframes iov{0%,50%{opacity:1}100%{opacity:0}}
#introImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;filter:invert(1);opacity:.3;animation:iim 6.6s ease-in forwards}
@keyframes iim{0%{opacity:.3;transform:scale(1);filter:invert(1) blur(0)}22%{opacity:.55;transform:scale(1.12);filter:invert(1) blur(1px)}100%{opacity:0;transform:scale(2.3);filter:invert(1) blur(34px)}}
/* ===== grand finale + heart maze ===== */
#gold,#gold2,#gl{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0}
#gold{background:radial-gradient(ellipse at 50% 55%,#fffdf0 0%,#ffe9a0 35%,#f6c445 70%,#c98a12 100%);transition:opacity 4.6s ease-in;animation:gsh 1.8s ease-in-out infinite alternate}
@keyframes gsh{to{filter:brightness(1.12) saturate(1.25)}}
#gold2{background:radial-gradient(ellipse at 50% 45%,#6b3d06 0%,#2b1602 55%,#0d0701 100%);transition:opacity 2.6s}
#gl{width:100%;height:100%;transition:opacity 2s}
#gold.on,#gold2.on,#gl.on{opacity:1}
#ubox.gold #upbg{filter:blur(20px) sepia(1) saturate(5)}
#ubox.gold .tp{background:#fff7c2;box-shadow:0 0 12px 4px #fbbf24}
#ubox.gold #uedge{background:linear-gradient(90deg,transparent,#fff 30%,#fde68a 50%,#fff 70%,transparent);box-shadow:0 0 18px 6px #f59e0b99}
#hin{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#1a0410;opacity:0}
#hin.go{display:flex;animation:hinb 1.2s forwards}
@keyframes hinb{to{opacity:1}}
#hheart{width:120px;height:120px;filter:drop-shadow(0 0 30px #fb7185);scale:.1}
#hin.go #hheart{animation:hdive 4.6s cubic-bezier(.5,0,.8,.5) .9s forwards}
@keyframes hdive{0%{scale:.12}15%{scale:.2}22%{scale:.16}37%{scale:.34}44%{scale:.27}62%{scale:1.2}69%{scale:.95}100%{scale:60}}
#s2{background:radial-gradient(ellipse at 50% 40%,#5b1030,#1d0612 85%);color:#ffd6e3;justify-content:flex-start;padding-top:14px;gap:8px;overflow:hidden}
#s2 h2{font-size:1.2rem;text-shadow:0 0 12px #ff4d86}
#mzHint{font-size:.85rem;opacity:.8}
#mz{display:block;touch-action:none}
#mzMsg{min-height:1.6em;font-size:1.05rem;opacity:0;transition:opacity 1s;color:#fff}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:6px;justify-content:center}
#dpad button{padding:0;font-size:1.1rem;background:#ff4d86aa;box-shadow:none}
#gm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#12030acc;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:5}
#gmBox{max-height:92vh;overflow:auto}
#gmBox #heartArea{height:44vh}
#qo.ic{display:flex;flex-wrap:wrap;gap:8px}
#qo.ic .opt{width:calc(33.3% - 6px);margin:0;padding:8px 4px}
.opt:disabled{opacity:.6}

/* ===== heart door + FPV ===== */
#s7{background:radial-gradient(ellipse at 50% 40%,#2a1030,#0a0612 75%);color:#fde8ef;overflow:hidden;gap:10px}
#s7 p{min-height:3.4em;max-width:360px;line-height:1.6;text-shadow:0 0 10px #f472b6}
#drw{position:relative;width:min(66vw,240px);height:min(44vh,320px);perspective:900px}
#drlight{position:absolute;inset:0;background:radial-gradient(ellipse,#fff1f5,#fb7185 55%,#9f1239);border-radius:120px 120px 0 0;box-shadow:0 0 60px #fb7185}
#drl,#drr{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#4a2a1c,#6b3f2a 50%,#3b2014);border:3px solid #c9a24b;transition:transform 2.6s cubic-bezier(.5,0,.2,1);z-index:2}
#drl{left:0;transform-origin:left;border-radius:120px 0 0 0}#drr{right:0;transform-origin:right;border-radius:0 120px 0 0}
#drw.open #drl{transform:rotateY(-108deg)}#drw.open #drr{transform:rotateY(108deg)}
#drlock{position:absolute;left:50%;top:54%;width:108px;padding:12px;border-radius:50%;transform:translate(-50%,-50%);z-index:3;background:radial-gradient(#f5d77a,#a67c1d);box-shadow:0 0 0 3px #7a5a12;transition:opacity 1.2s,filter .2s}
#drw.open #drlock{opacity:0}
#drslot{width:84px;display:block}
#drtray{display:flex;gap:16px;align-items:flex-start;justify-content:center;z-index:5}
.dri{width:76px;text-align:center;font-size:2.3rem;cursor:pointer;user-select:none;transition:.5s}
.dri small{display:block;font-size:.75rem;color:#fbcfe8}
.dri.off{opacity:.3;pointer-events:none}.dri.gone{opacity:0;pointer-events:none}

#flame{transition:opacity .5s}#flame.out{opacity:0}

#paperG{transition:transform 1.6s ease}
#letterG.open #paperG{transform:translateY(-34px) scale(1.25);transform-box:fill-box;transform-origin:50% 100%}
#letterG:not(.open){animation:lpulse 1.8s ease-in-out infinite}
@keyframes lpulse{50%{opacity:.6}}
#wh{position:fixed;inset:0;background:#fff;z-index:100;opacity:0;pointer-events:none;transition:opacity 6s ease-in}

/* Infinity loop (first page) */
(function(){
  const NS="http://www.w3.org/2000/svg",svg=$("inf"),lp=$("lp"),cm=$("comet"),cv=$("cvi"),ctx=cv.getContext("2d"),
        L=lp.getTotalLength(),N=240,LOOPS=8,pts=[],nx=[],ny=[];
  for(let i=0;i<N;i++)pts.push(lp.getPointAtLength(i/N*L));
  for(let i=0;i<N;i++){const a=pts[(i+N-1)%N],b=pts[(i+1)%N],tx=b.x-a.x,ty=b.y-a.y,m=Math.hypot(tx,ty)||1;nx.push(-ty/m);ny.push(tx/m)}
  /* stars */
  for(let i=0;i<70;i++){const d=document.createElement("div"),z=1+Math.random()*2;d.className="st";
    d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*3}s`;$("night").appendChild(d)}
  /* glow sprites */
  const sprite=c=>{const s=document.createElement("canvas");s.width=s.height=32;const g=s.getContext("2d"),r=g.createRadialGradient(16,16,0,16,16,16);
    r.addColorStop(0,c+"ff");r.addColorStop(.25,c+"aa");r.addColorStop(1,c+"00");g.fillStyle=r;g.fillRect(0,0,32,32);return s};
  const SP=[sprite("#ffffff"),sprite("#e0d9ff"),sprite("#a78bfa"),sprite("#818cf8")];
  let k=1;
  function fit(){const w=cv.clientWidth||400,d=Math.min(window.devicePixelRatio||1,2);cv.width=w*d;cv.height=w*d*210/400;k=cv.width/400}
  fit();addEventListener("resize",fit);
  /* particles flowing along the figure-8 (leftward = decreasing u) */
  const P=[];
  for(let i=0;i<420;i++)P.push({u:Math.random(),sp:.00008+Math.random()*.00009,o:(Math.random()+Math.random()+Math.random()-1.5)*20,
    ph:Math.random()*6.28,sz:2+Math.random()*5,t:Math.random()<.3?0:Math.random()<.5?1:Math.random()<.6?2:3});
  const sparks=[];
  const at=(u,o)=>{const f=(((u%1)+1)%1)*N,i=Math.floor(f),r=f-i,j=(i+1)%N,a=pts[i%N],b=pts[j];
    const x=a.x+(b.x-a.x)*r,y=a.y+(b.y-a.y)*r,X=nx[i%N]+(nx[j]-nx[i%N])*r,Y=ny[i%N]+(ny[j]-ny[i%N])*r;return[x+X*o,y+Y*o]};
  const HOLD=3/8;let q=0,pr=0,acc=0,last=null,done=false,touching=false,stopped=false,lt=0;

  function frame(now){
    if(stopped)return;
    const dt=Math.min(50,now-(lt||now));lt=now;
    ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,400,210);ctx.globalCompositeOperation="lighter";
    const gi=Math.pow(q,1.2),HINT=true;
    /* soft glow body */
    ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();for(let i=0;i<=N;i++){const p=pts[i%N];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
    ctx.strokeStyle=`rgba(129,140,248,${.09*gi})`;ctx.lineWidth=22;ctx.stroke();
    /* flowing silky strands */
    for(let j=0;j<3;j++){
      ctx.beginPath();
      for(let i=0;i<=N;i++){const u=i/N,o=(10+4*j)*Math.sin(u*6.283*(2+j)+now*.0018*(1+j*.3)+j*2);
        const q=at(u,o);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
      ctx.strokeStyle=`rgba(${j?"196,181,253":"240,236,255"},${(.5-j*.1)*gi})`;ctx.lineWidth=1.3;ctx.shadowColor="#a78bfa";ctx.shadowBlur=10;ctx.stroke();
    }
    ctx.shadowBlur=0;
    /* sparkling particles */
    const shown=Math.floor(P.length*q);
    for(let pi=0;pi<shown;pi++){const p=P[pi];
      p.u-=p.sp*dt;
      const o=p.o*(1+.4*Math.sin(now*.002+p.ph)),pq=at(p.u,o),sz=p.sz*(1+.5*q)*(.8+.4*Math.sin(now*.004+p.ph));
      ctx.globalAlpha=Math.min(1,(.35+.5*Math.abs(Math.sin(now*.0015+p.ph)))*gi);
      ctx.drawImage(SP[p.t],pq[0]-sz,pq[1]-sz,sz*2,sz*2);
    }
    ctx.globalAlpha=1;
    /* finger sparks */
    for(let i=sparks.length-1;i>=0;i--){const a=sparks[i];a.life-=dt;if(a.life<=0){sparks.splice(i,1);continue}
      a.x+=a.vx*dt;a.y+=a.vy*dt;const z=12*a.life/a.max;ctx.globalAlpha=a.life/a.max;ctx.drawImage(q<.4?SP[3]:SP[0],a.x-z,a.y-z,z*2,z*2)}
    ctx.globalAlpha=1;
    /* bright comet head, also moving left */
    tail.forEach((c,i)=>{c.setAttribute("fill",q<.4?"#8b7cf6":"#fff");c.style.display=HINT?"":"none";const f=((now/4500-i*.006)%1+1)%1,p=lp.getPointAtLength((1-f)*L);c.setAttribute("cx",p.x);c.setAttribute("cy",p.y)});
    requestAnimationFrame(frame);
  }
  const mk=(r,f)=>{const c=document.createElementNS(NS,"circle");c.setAttribute("r",r);c.setAttribute("fill",f);return c};
  const tail=[];
  for(let i=0;i<12;i++){const c=mk(8-i*.55,"#fff");c.style.opacity=(1-i/12)*.95;c.style.filter="drop-shadow(0 0 8px #a78bfa)";cm.appendChild(c);tail.push(c)}
  requestAnimationFrame(frame);
  function pos(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())}
  function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=.01+Math.random()*.04;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:600,max:600})}}
  svg.onpointerdown=e=>{start();touching=true;last=null;svg.setPointerCapture(e.pointerId)};
  svg.onpointerup=svg.onpointercancel=()=>{touching=false;last=null};
  svg.onpointermove=e=>{
    if(!touching||done)return;
    const p=pos(e);let bi=0,bd=1e9;
    pts.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;bi=i}});
    if(bd>45){last=null;return}

    if(last!==null){let d=bi-last;if(d>N/2)d-=N;if(d<-N/2)d+=N;if(d<0&&-d<N/6)acc+=-d}
    last=bi;
    pr=Math.min(1,acc/(N*LOOPS));q=Math.max(0,(pr-HOLD)/(1-HOLD));

    if(pr>=1){done=true;burst(200,100,80);introFx();setTimeout(()=>go(1),600);setTimeout(()=>stopped=true,1500)}
  };
})();

/* ===== audio: heart track + voice clips blended ===== */
const HA={m:null,h:null,v:null,t:0,on:false,fx:new Map()};
function fade(el,to,ms,cb){
  if(!el)return;clearInterval(HA.fx.get(el));const from=el.volume,t0=performance.now();
  const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/ms);el.volume=Math.max(0,Math.min(1,from+(to-from)*p));if(p>=1){clearInterval(iv);cb&&cb()}},40);HA.fx.set(el,iv);
}
function heartStart(){
  heartKill(true);HA.on=true;
  fade(bgm,0,2000,()=>bgm.pause());
  if(CONFIG.heartMusic){const m=HA.m=new Audio(CONFIG.heartMusic);m.loop=true;m.volume=0;m.play().then(()=>fade(m,CONFIG.musicVol||.6,3500)).catch(()=>{})}
  if(CONFIG.heartBeat){const h=HA.h=new Audio(CONFIG.heartBeat);h.loop=true;h.volume=0;h.play().then(()=>fade(h,CONFIG.heartBeatVol||.55,2500)).catch(()=>{})}
  const L=CONFIG.heartVoices||[];let i=0;
  const nextV=()=>{
    if(!HA.on||i>=L.length)return;
    const v=HA.v=new Audio(L[i++]);v.volume=0;let fin=false,fadedOut=false;
    const end=()=>{if(fin)return;fin=true;HA.m&&fade(HA.m,CONFIG.musicVol||.6,2000);if(HA.on)HA.t=setTimeout(nextV,CONFIG.voiceGapMs||9000)};
    v.onplaying=()=>{HA.m&&fade(HA.m,CONFIG.musicDuck||.35,1200);fade(v,1,1200)};
    v.ontimeupdate=()=>{if(!fadedOut&&v.duration&&v.duration-v.currentTime<1.2){fadedOut=true;fade(v,0,1100)}};
    v.onended=end;v.onerror=end;
    v.play().catch(end);
  };
  HA.t=setTimeout(nextV,CONFIG.voiceFirstMs||7000);
}
function heartVoicesStop(){HA.on=false;clearTimeout(HA.t);if(HA.v){const v=HA.v;v.onended=v.onerror=null;fade(v,0,800,()=>v.pause())}}
function heartKill(quiet){
  HA.on=false;clearTimeout(HA.t);
  if(HA.v){HA.v.onended=HA.v.onerror=null;HA.v.pause();HA.v=null}
  if(HA.m){const m=HA.m;HA.m=null;fade(m,0,800,()=>m.pause())}
  if(HA.h){const h=HA.h;HA.h=null;fade(h,0,800,()=>h.pause())}
  if(!quiet&&CONFIG.music&&musicOn&&bgm.paused){bgm.play().then(()=>fade(bgm,.6,2000)).catch(()=>{})}
}

/* ===== cake: blow out the candle, open the letter, light takes over ===== */
let cakeLetter=0;
function startCake(){
  cakeLetter=0;$("wh").className="";
  ["flame","cglowc"].forEach(i=>$(i).classList.remove("out"));$("smoke").classList.remove("go");
  $("letterG").classList.remove("open");$("cakeMsg").textContent="🕯️ ඉටිපන්දම ඇල්ලුවම නිවෙනවා…";
  $("candHit").onclick=()=>{if($("flame").classList.contains("out"))return;
    $("flame").classList.add("out");$("cglowc").classList.add("out");
    const sm=$("smoke");sm.classList.remove("go");void sm.getBoundingClientRect();sm.classList.add("go");
    navigator.vibrate&&navigator.vibrate(40);$("cakeMsg").textContent="ඔයාගේ ඉත්ත ඉටු වේවා ✨ දැන් ලියුම ඇල්ලුවම ඇරෙනවා 💌"};
  $("letterG").onclick=openLetter;
}
function openLetter(){
  if(cakeLetter)return;cakeLetter=1;$("letterG").classList.add("open");$("cakeMsg").textContent="💌";
  HA.m&&fade(HA.m,.3,2500);
  let ended=false;const fin=()=>{if(ended)return;ended=true;lightsOut()};
  setTimeout(()=>{
    if(!CONFIG.letterVoice){setTimeout(fin,CONFIG.letterFallbackMs||9000);return}
    const a=new Audio(CONFIG.letterVoice);a.onended=fin;a.onerror=()=>setTimeout(fin,CONFIG.letterFallbackMs||9000);
    a.play().catch(()=>setTimeout(fin,CONFIG.letterFallbackMs||9000));
  },1500);
}
function lightsOut(){
  $("wh").classList.add("on");HA.m&&fade(HA.m,0,6000);HA.h&&fade(HA.h,0,6000);
}

/* Vault */
function unlock(){
  if($("pw").value!==CONFIG.passcode){alert("වැරදියි 🙈");return}
  $("vIn").style.display="none";const v=$("vList");v.style.display="block";
  v.innerHTML=CONFIG.vault.map(x=>`<p><a href="${x.url}" target="_blank" rel="noopener">${x.label}</a></p>`).join("");
  if(CONFIG.msgUrl){$("vMsgHint").textContent=CONFIG.msgHint;$("vMsg").style.display="flex"}
}
async function sendMsg(){
  const t=$("vText").value.trim(),st=$("vMsgSt");
  if(!t){st.textContent="මොකක් හරි ලියන්න 🙈";return}
  st.textContent="යවනවා...";
  try{
    await fetch(CONFIG.msgUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:CONFIG.msgKey,text:t})});
    $("vText").value="";st.textContent="යැව්වා 💙 මට ලැබුණා";
  }catch(e){st.textContent="යවන්න බැරි වුණා, ආයෙ උත්සාහ කරන්න"}
}
